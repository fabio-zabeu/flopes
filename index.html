<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d2698f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flopes">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=3">
<title>Flopes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: gestão no computador = menu lateral fixo + barra superior + área de conteúdo larga; celular = app de cadastro em tela única com barra de ação fixa embaixo */
:root{
  --bg:#ffffff; --panel:#fafafa; --fg:#151515; --fg2:#3d3d3d; --muted:#6f6f6f; --faint:#a6a6a6;
  --line:#ececec; --line2:#dcdcdc; --fill:#f4f4f4; --fill2:#e9e9e9; --hover:#f6f6f6;
  --ink:#151515; --ink-fg:#ffffff; --pos:#2f7a4f; --neg:#b4473f; --warn:#8a6a1f;
  --accent:#b8487a; --accent-hover:#a63d6c; --accent-fg:#ffffff; --sp-bg:#fff5f8; --sp-b1:#fbd3e2; --sp-b2:#f8e3ec; --sp-ink:#3b1f2c; --sp-pink:#b8487a; --sp-mute:#8f6878;
  --water:#eeeeee; --road:#dadada; --scrim:rgba(10,10,10,.36); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.08);
  --sans:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Instrument Serif",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --panel:#1a1a1a; --fg:#ededed; --fg2:#cfcfcf; --muted:#9a9a9a; --faint:#666;
  --line:#272727; --line2:#353535; --fill:#202020; --fill2:#2c2c2c; --hover:#1d1d1d;
  --ink:#ededed; --ink-fg:#141414; --pos:#6cbf8c; --neg:#e58076; --warn:#d6b15e;
  --accent:#f0a6c2; --accent-hover:#f5bdd2; --accent-fg:#1d1218; --sp-bg:#1b1318; --sp-b1:#4a2536; --sp-b2:#30202a; --sp-ink:#fbe7ef; --sp-pink:#f0a6c2; --sp-mute:#b293a1;
  --water:#222; --road:#363636; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1a1a1a; --fg:#ededed; --fg2:#cfcfcf; --muted:#9a9a9a; --faint:#666;
  --line:#272727; --line2:#353535; --fill:#202020; --fill2:#2c2c2c; --hover:#1d1d1d;
  --ink:#ededed; --ink-fg:#141414; --pos:#6cbf8c; --neg:#e58076; --warn:#d6b15e;
  --accent:#f0a6c2; --accent-hover:#f5bdd2; --accent-fg:#1d1218; --sp-bg:#1b1318; --sp-b1:#4a2536; --sp-b2:#30202a; --sp-ink:#fbe7ef; --sp-pink:#f0a6c2; --sp-mute:#b293a1;
  --water:#222; --road:#363636; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
.num,.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.wordmark{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;letter-spacing:-.01em}

/* ---------- desktop shell ---------- */
.desk{display:flex;min-height:100%}
.side{width:228px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 22px}
.brand small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.navg{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--fg2);font-weight:500}
.nav a:hover{background:var(--fill)}
.nav a.on{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.nav a svg{width:18px;height:18px;color:var(--muted)}
.nav a.on svg{color:var(--fg)}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--fill2);border-radius:10px;padding:0 7px;line-height:18px}
.side-card{margin-top:auto;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.side-card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.side-card .v{font-size:20px;font-weight:600;letter-spacing:-.02em}

.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);height:58px;display:flex;align-items:center;gap:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.gsearch{position:relative;flex:1;max-width:420px}
.gsearch input{width:100%;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 12px 0 36px}
.gsearch input:focus{outline:none;border-color:var(--line2);background:var(--bg)}
.gsearch>svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--muted)}
.gres{position:absolute;top:42px;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:30;max-height:420px;overflow:auto}
.gres .gh{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:8px 8px 4px}
.gres .gi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;cursor:pointer}
.gres .gi:hover{background:var(--fill)}
.gres .gi svg{width:16px;height:16px;color:var(--muted)}
.sample{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sample i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.spacer{flex:1}
.content{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px 80px;max-width:1280px;width:100%}

.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph-row h1{font-size:26px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.15;text-wrap:balance}
.ph-row p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;margin-bottom:10px}
.back:hover{color:var(--fg)}
.back svg{width:15px;height:15px}
h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sec-h .muted{font-size:13px}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);font-weight:500;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--fill)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.lg{height:52px;font-size:16px;border-radius:12px;padding:0 20px}
.btn.full{width:100%}
.btn.icon{width:36px;padding:0}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn svg{width:16px;height:16px}
.btn.danger{color:var(--neg)}
.lnk{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;cursor:pointer}
.lnk:hover{text-decoration-color:var(--fg)}
.input,select.input{height:36px;width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:0 11px;min-width:0}
textarea.input{height:auto;padding:9px 11px;min-height:70px;resize:vertical}
.input:focus{outline:none;border-color:var(--fg)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.fld .hint{font-size:12px;color:var(--muted)}
.affix{position:relative}
.affix span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.affix .input{padding-left:34px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);font-size:13px;color:var(--fg2);background:var(--bg);white-space:nowrap}
.chip:hover{background:var(--fill)}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.6}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;line-height:22px;padding:0 9px 0 8px;border-radius:11px;white-space:nowrap;background:var(--fill);color:var(--fg2)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.st.completar{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line2);color:var(--fg2)}
.st.completar i{background:none;border:1.5px dashed var(--muted);width:8px;height:8px}
.st.estoque i{background:var(--faint)}
.st.anunciada i{background:var(--muted)}
.st.reservada{background:var(--fill2)} .st.reservada i{background:var(--fg2)}
.st.vendida{background:var(--ink);color:var(--ink-fg)} .st.vendida i{background:var(--ink-fg)}
.dpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;line-height:22px;padding:0 9px;border-radius:11px;white-space:nowrap}
.dpill.prep{box-shadow:inset 0 0 0 1px var(--line2);color:var(--fg2)}
.dpill.ar{background:var(--ink);color:var(--ink-fg)}
.dpill.ar i{width:6px;height:6px;border-radius:50%;background:var(--ink-fg);animation:pulse 1.8s infinite}
.dpill.ant{background:var(--fill);color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}

/* cards / kpis */
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.card-p{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .k svg{width:15px;height:15px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.kpi.hl .k,.kpi.hl .s{color:var(--ink-fg);opacity:.72}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.prog{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;display:flex}
.prog b{display:block;height:100%;background:var(--fg)}
.prog b+b{background:var(--muted)}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:6px;border-radius:2px;background:var(--fg)}
.legend i.m{background:var(--muted)}
.todo{display:flex;flex-direction:column}
.todo .ti{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.todo .ti:first-child{border-top:0}
.todo .ti .grow{flex:1;min-width:0}
.callout{display:flex;gap:12px;background:var(--fill);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--fg2)}
.callout svg{width:18px;height:18px;color:var(--muted);margin-top:1px}
.callout p{margin:0}

/* thumbnails */
.ph{background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:52%;height:52%}
.th{width:40px;height:48px;border-radius:6px}
.th.s{width:32px;height:38px;border-radius:5px}
.strip{display:flex;gap:4px}
.strip .ph{width:34px;height:42px;border-radius:5px}
.strip .more{width:34px;height:42px;border-radius:5px;background:var(--fill);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

/* tabela */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
table.t{border-collapse:collapse;width:100%;min-width:820px;font-size:13.5px}
.t th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.t td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--hover)}
.t tr.sel td{background:var(--fill)}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t .pc{display:flex;align-items:center;gap:12px;min-width:0;max-width:300px}
.t .pc>div{min-width:0}
.t .pc b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.t .cb{width:36px;padding-right:0}
.t tfoot td{background:var(--panel);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.bar{height:6px;border-radius:3px;background:var(--fill2);min-width:70px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--fg)}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input,.toolbar select.input{width:auto;height:34px;max-width:100%}
.tsearch{position:relative;flex:1;min-width:200px;max-width:320px}
.tsearch input{padding-left:34px;height:34px}
.tsearch svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted)}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--ink-fg);border-radius:10px;padding:8px 10px 8px 16px;margin-bottom:14px}
.bulk select{height:30px;border-radius:7px;border:0;background:var(--ink-fg);color:var(--ink);padding:0 8px;font-size:13px}
.bulk .btn{height:30px;font-size:13px;background:var(--ink-fg);color:var(--ink);border:0}
.bulk .btn.ghost{background:none;color:var(--ink-fg)}

/* galeria */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gc{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;transition:box-shadow .15s}
.gc:hover{box-shadow:var(--shadow)}
.gc .ph{aspect-ratio:4/5;width:100%;max-width:100%}
.gc .ph .st{position:absolute;left:8px;top:8px}
.gc .gb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.gc .gb b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .gb .pr{font-weight:600;font-variant-numeric:tabular-nums}

/* quadro (kanban) */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;min-width:0;transition:background .12s}
.col.over{background:var(--fill2)}
.col-h{display:flex;align-items:flex-start;justify-content:space-between;padding:2px 4px 4px;gap:6px}
.col-h .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:22px}
.col-h small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.kc{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:10px;cursor:grab;align-items:center;min-width:0}
.kc:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.kc.drag{opacity:.4}
.kc .ph{width:44px;height:54px;border-radius:6px}
.kc .kb{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.kc .kb b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kb .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kb .pr{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.kc .miss{font-size:11px;color:var(--warn)}
.col .empty-c{font-size:12px;color:var(--faint);text-align:center;padding:18px 6px;border:1px dashed var(--line2);border-radius:8px}

/* lista de drops */
.drops{display:flex;flex-direction:column;gap:10px}
.dc{display:grid;grid-template-columns:150px minmax(0,1fr) 220px 110px 110px 18px;align-items:center;gap:20px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);transition:box-shadow .15s}
.dc:hover{box-shadow:var(--shadow)}
.dc .dn{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.dc .dn b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.dc .dn span{font-size:13px;color:var(--muted)}
.dc .sv{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.dc .sv .row{justify-content:space-between}
.dc .money{text-align:right;font-variant-numeric:tabular-nums}
.dc .money b{display:block;font-size:15px;font-weight:600}
.dc .money small{font-size:12px;color:var(--muted)}
.dc>svg{color:var(--faint);width:18px;height:18px}
.dc.next{border-style:dashed;border-color:var(--line2)}

/* mapa */

.split2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;align-items:start}
.checkrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}

.box{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center}

.checkrow.on .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}

/* chart */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .grid{stroke:var(--line)}
.chart .b{fill:var(--fill2)}
.chart .b.hl{fill:var(--fg)}
.chart .lab{fill:var(--fg);font-weight:600;font-size:11px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

.dr-b{flex:1;overflow:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:22px}
.dr-f{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dr-top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.upl{position:relative;aspect-ratio:4/5;width:100%;max-width:100%;border-radius:10px;overflow:hidden}

.sect{display:flex;flex-direction:column;gap:12px}

.calc{height:36px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:var(--fill);font-variant-numeric:tabular-nums;font-weight:500}

.warnline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn)}

.stsel{display:flex;gap:6px;flex-wrap:wrap}
.stsel button{background:var(--bg);color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2);line-height:28px;padding:0 12px 0 10px;border-radius:14px}
.stsel button:hover{background:var(--fill)}
.stsel button.on{background:var(--ink);color:var(--ink-fg);box-shadow:none}

.money2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.money2>div{padding:12px 14px}
.money2>div+div{border-left:1px solid var(--line)}

.modalw{position:fixed;inset:0;z-index:61;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;pointer-events:none}
.modal{pointer-events:auto;background:var(--bg);border-radius:14px;width:100%;max-width:540px;max-height:84vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:fade .15s}

.m-b{padding:4px 20px 18px;display:flex;flex-direction:column;gap:14px}
.m-f{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg);z-index:2}
.scrim.top{z-index:60}
.scrim.dark{background:rgba(8,8,8,.86)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.drawer,.modal{animation:none}.dpill.ar i{animation:none}}
.x{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}

/* telefone (preview) */

.phone{width:390px;height:min(800px,calc(100vh - 40px));border-radius:44px;background:var(--bg);box-shadow:0 0 0 10px #0b0b0b,0 0 0 11px #333,0 30px 80px rgba(0,0,0,.5);overflow:hidden;position:relative;flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- abertura ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--sp-bg);color:var(--sp-ink);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;animation:spOut .7s cubic-bezier(.6,0,.3,1) 3.1s forwards;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#splash.skip{animation:spOut .4s ease forwards}
@keyframes spOut{to{opacity:0;transform:scale(1.04);filter:blur(6px);visibility:hidden}}
.sp-blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.9}
.sp-blob.a{width:46vmax;height:46vmax;background:var(--sp-b1);left:-14vmax;top:-16vmax;animation:spFloat 7s ease-in-out infinite alternate}
.sp-blob.b{width:40vmax;height:40vmax;background:var(--sp-b2);right:-12vmax;bottom:-14vmax;animation:spFloat 8s ease-in-out -2s infinite alternate-reverse}
.sp-blob.c{width:22vmax;height:22vmax;background:var(--sp-b1);right:12vmax;top:-6vmax;opacity:.55;animation:spFloat 6s ease-in-out -1s infinite alternate}
@keyframes spFloat{to{transform:translate(4vmax,3vmax) scale(1.08)}}
.sp-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sp-hanger{width:clamp(96px,14vw,132px);height:auto;color:var(--sp-pink);transform-origin:50% 8%;opacity:0;animation:spDrop .9s cubic-bezier(.34,1.5,.6,1) .1s forwards,spSwing 2.2s ease-out 1s}
@keyframes spDrop{from{opacity:0;transform:translateY(-55vh)}to{opacity:1;transform:none}}
@keyframes spSwing{0%{transform:rotate(0)}15%{transform:rotate(9deg)}38%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}}
.sp-hanger .tag{transform-origin:78px 47px;animation:spTag 1.6s ease-in-out 1.1s 2}
@keyframes spTag{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}65%{transform:rotate(10deg)}}
.sp-word{position:relative;font-family:var(--serif);font-style:italic;font-size:clamp(72px,12vw,138px);line-height:1;letter-spacing:-.01em;white-space:nowrap;margin-top:2px}
.sp-l{display:inline-block;opacity:0;transform:translateY(.4em) scale(.5) rotate(-8deg);animation:spPop .7s cubic-bezier(.34,1.7,.55,1) forwards;animation-delay:calc(.75s + var(--i) * .08s)}
@keyframes spPop{to{opacity:1;transform:none}}
.sp-stitch{width:min(80%,320px);height:10px;color:var(--sp-pink)}
.sp-stitch path{stroke-dasharray:6 7;stroke-dashoffset:0;clip-path:inset(0 100% 0 0);animation:spSew 1.1s cubic-bezier(.5,0,.3,1) 1.35s forwards}
@keyframes spSew{to{clip-path:inset(0 0 0 0)}}
.sp-spark{position:absolute;width:18px;height:18px;color:var(--sp-pink);opacity:0;transform:scale(0) rotate(-30deg);animation:spTw 1.6s ease-in-out forwards}
.sp-spark.s1{left:-6%;top:12%;animation-delay:1.5s}
.sp-spark.s2{right:-5%;top:0;width:24px;height:24px;animation-delay:1.7s}
.sp-spark.s3{right:6%;bottom:-6%;width:13px;height:13px;animation-delay:1.95s}
.sp-spark.s4{left:12%;bottom:-2%;width:11px;height:11px;animation-delay:2.15s}
@keyframes spTw{0%{opacity:0;transform:scale(0) rotate(-30deg)}35%{opacity:1;transform:scale(1.15) rotate(10deg)}60%{transform:scale(.85) rotate(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
.sp-sub{font-size:15px;color:var(--sp-mute);opacity:0;animation:spIn .6s ease-out 1.7s forwards;letter-spacing:.01em}
.sp-sub b{color:var(--sp-ink);font-weight:600;font-variant-numeric:tabular-nums}
.sp-sub .hrt{color:var(--sp-pink)}
.sp-pill{margin-top:6px;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--sp-pink);background:color-mix(in srgb,var(--sp-pink) 12%,transparent);border-radius:999px;padding:6px 14px;opacity:0;transform:translateY(8px);animation:spUp .5s cubic-bezier(.34,1.5,.6,1) 2.05s forwards}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spIn{to{opacity:1}}
.sp-skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--sp-mute);opacity:0;animation:spIn .5s ease-out 1.4s forwards}
@media (prefers-reduced-motion:reduce){#splash{animation:spOut .3s ease 1.2s forwards}.sp-blob,.sp-hanger,.sp-hanger .tag,.sp-l,.sp-spark,.sp-sub,.sp-pill,.sp-skip{animation:none;opacity:1;transform:none}.sp-stitch path{animation:none;clip-path:none}}


/* abertura com o gatinho (cores da ilustração, iguais nos dois temas) */

@keyframes catIn{from{opacity:0;transform:scale(.7) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes catTail{0%,100%{transform:rotate(0)}35%{transform:rotate(-3deg)}70%{transform:rotate(1.8deg)}}
@keyframes catTag{from{transform:rotate(-13deg)}to{transform:rotate(15deg)}}
@keyframes catLegL{0%,100%{transform:rotate(0)}25%{transform:rotate(11deg)}40%{transform:rotate(5deg)}55%{transform:rotate(12deg)}75%{transform:rotate(2deg)}}
@keyframes catLegR{0%,100%{transform:rotate(0)}30%{transform:rotate(-13deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(-14deg)}80%{transform:rotate(-3deg)}}

.okmark{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;justify-content:center;margin:30px auto 6px}
.okmark svg{width:34px;height:34px}
.m-center{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.m-center h2{font-size:22px;letter-spacing:-.02em}
.m-center p{margin:0;color:var(--muted);max-width:30ch}
.mrow{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.mrow:first-child{border-top:0}
.mrow b{font-variant-numeric:tabular-nums}

/* responsivo da gestão */
.mnav{display:none}
@media (max-width:1180px){.dc{grid-template-columns:130px minmax(0,1fr) 180px 110px 18px}.dc .r2{display:none}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash,.split2{grid-template-columns:minmax(0,1fr)}.dc{grid-template-columns:130px minmax(0,1fr) 110px 18px}.dc .sv{display:none}}
input[type=date].input{-webkit-appearance:none;appearance:none;display:block;line-height:34px;text-align:left;min-width:0}
input[type=date].input::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].input::-webkit-calendar-picker-indicator{opacity:.6}
.cl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){
  .top .spacer{display:none}
  .gsearch{max-width:none;min-width:0}
  .gres{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));max-height:70vh;z-index:40}
  .modal .g2,.modal .g3,.drawer .g2,.drawer .g3,.cl-grid{grid-template-columns:minmax(0,1fr)}
  .modal .input,.modal select.input,.drawer .input,.drawer select.input{height:44px;font-size:16px}
  .modal .btn,.drawer .dr-f .btn{height:40px}
  .modal .seg{display:flex}.modal .seg button{flex:1;height:36px}
  .modal .m-f .btn{flex:1}
  .side{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
  .mnav a{height:32px;padding:0 12px;border-radius:16px;display:inline-flex;align-items:center;color:var(--muted);font-weight:500;white-space:nowrap}
  .mnav a.on{background:var(--ink);color:var(--ink-fg)}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .sample,.top .hide-s{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .dash>*,.split2>*,.card,.kpi{min-width:0}
  .strip{flex-wrap:wrap}
  .todo .ti .btn{white-space:normal;height:auto;min-height:30px;padding-block:4px;text-align:center}
  .content{overflow-x:clip}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .dr-top{grid-template-columns:110px minmax(0,1fr)}
  .dc{grid-template-columns:minmax(0,1fr) 18px}.dc .dm,.dc .money{display:none}
  .phone-note{display:none}
}

const S={settings:{gas:6.29,kmL:11,markup:3,reinvest:30,dropDay:4,stale:30,inicial:600,home:'Asa Norte',confirmed:true},brechos:[],garimpos:[],drops:[],pecas:[],despesas:[]};
const B=id=>S.brechos.find(b=>b.id===id);
const G=id=>S.garimpos.find(g=>g.id===id);
const P=id=>S.pecas.find(p=>p.id===id);

function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const homeLL=()=>REGIOES[S.settings.home]||REGIOES['Asa Norte'];
const bLL=b=>REGIOES[b.regiao]||homeLL();
function route(ids){
  const pts=ids.map(B).filter(Boolean);const home=homeLL();
  let cur=home,left=[...pts],order=[],km=0;
  while(left.length){let bi=0,bd=1e9;left.forEach((b,i)=>{const d=hav(cur,bLL(b));if(d<bd){bd=d;bi=i}});km+=bd+1.5;cur=bLL(left[bi]);order.push(left[bi]);left.splice(bi,1)}
  if(order.length)km+=hav(cur,home);
  return{order,km:Math.round(km*1.3)};
}
const gq=b=>[b.nome,b.endereco,b.regiao,'Brasília - DF'].filter(Boolean).join(', ');
const mapsSearch=b=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(gq(b));
function mapsRoute(order){const o=encodeURIComponent((S.settings.home||'Asa Norte')+', Brasília - DF');const w=order.slice(0,9).map(gq).map(encodeURIComponent).join('%7C');return `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${o}${w?'&waypoints='+w:''}&travelmode=driving`}
const instaUrl=h=>{const x=String(h||'').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'');return x?'https://www.instagram.com/'+encodeURIComponent(x)+'/':null};
const gasCost=km=>(km||0)/S.settings.kmL*S.settings.gas;

const pecasDe=g=>S.pecas.filter(p=>p.garimpoId===g.id);
const gGas=g=>gasCost(g.km);
const gPago=g=>sum(pecasDe(g),p=>p.pago||0);
function gasShare(p){const g=G(p.garimpoId);if(!g)return 0;const t=gPago(g);return t?gGas(g)*(p.pago||0)/t:0}
const DCATS=['Embalagem','Costura e ajustes','Lavagem','Etiquetas e tags','Fotos e anúncios','Outros'];
const DCAT_HINT={'Embalagem':'sacolas, caixas, fitas, papel de seda','Costura e ajustes':'costureira, linha, botões, zíper','Lavagem':'lavanderia, sabão, tira-manchas','Etiquetas e tags':'etiquetas, tags, cartões','Fotos e anúncios':'impulsionamento, cenário, acessórios de foto','Outros':''};
const gastosPeca=p=>S.despesas.filter(d=>d.pecaId===p.id);
const extraPeca=p=>sum(gastosPeca(p),d=>d.valor||0);
const custo=p=>(p.pago||0)+gasShare(p)+extraPeca(p);
const despGerais=()=>S.despesas.filter(d=>!d.pecaId);
const sugestao=p=>round5(custo(p)*S.settings.markup);
const lucro=p=>p.venda?p.venda.valor-custo(p):(p.preco!=null?p.preco-custo(p):null);
const reposicao=p=>{const l=lucro(p);return custo(p)+Math.max(0,l)*S.settings.reinvest/100};
const entry=p=>D(p.dropId)?.data||TODAY;
const missing=p=>[!p.preco&&'preço',!p.tam&&'tamanho',!p.cat&&'categoria'].filter(Boolean);
const isInc=p=>p.status!=='vendida'&&missing(p).length>0;
const col=p=>p.status==='vendida'?'vendida':isInc(p)?'completar':p.status;
const isStale=p=>(p.status==='anunciada'||p.status==='estoque')&&entry(p)<=TODAY&&diff(entry(p),TODAY)>S.settings.stale;
const dias=p=>p.venda?diff(entry(p),p.venda.data):entry(p)>TODAY?null:diff(entry(p),TODAY);

function nextDropDate(from){let d=addDays(from,1);while(s2d(d).getDay()!==+S.settings.dropDay)d=addDays(d,1);return d}
function renumberDrops(){S.drops.sort((a,b)=>a.data.localeCompare(b.data));S.drops.forEach((x,i)=>x.n=i+1)}
const nearDrop=date=>{const lim=addDays(date,7);return S.drops.filter(x=>x.data>date&&x.data<=lim).sort((a,b)=>a.data.localeCompare(b.data))[0]};
function targetDrop(date){return nearDrop(date)||ensureDrop(nextDropDate(date))}
function ensureDrop(date){let d=S.drops.find(x=>x.data===date);if(!d){d={id:uid('d'),n:0,data:date};S.drops.push(d);S.drops.sort((a,b)=>a.data.localeCompare(b.data));S.drops.forEach((x,i)=>x.n=i+1)}return d}
const dropsSorted=()=>S.drops.slice().sort((a,b)=>b.data.localeCompare(a.data));
const liveDrop=()=>S.drops.filter(x=>x.data<=TODAY).sort((a,b)=>b.data.localeCompare(a.data))[0];
const prepDrop=()=>S.drops.filter(x=>x.data>TODAY).sort((a,b)=>a.data.localeCompare(b.data))[0];
function dStatus(d){if(d.data>TODAY)return'prep';return liveDrop()?.id===d.id?'ar':'ant'}
const DSL={prep:'Em preparação',ar:'No ar',ant:'Anterior'};
const dPill=d=>{const s=dStatus(d);return `<span class="dpill ${s}">${s==='ar'?'<i></i>':''}${DSL[s]}</span>`};
const pecasDrop=d=>d?S.pecas.filter(p=>p.dropId===d.id):[];
function dStats(d){const ps=pecasDrop(d),v=ps.filter(p=>p.venda);const gs=S.garimpos.filter(g=>g.dropId===d.id);
  const desp=sum(despGerais().filter(x=>x.dropId===d.id),x=>x.valor||0);
  const inv=sum(ps,p=>p.pago||0)+sum(gs,gGas)+sum(ps,extraPeca)+desp;const rec=sum(v,p=>p.venda.valor);const luc=sum(v,lucro);
  return{ps,v,gs,inv,rec,luc,desp,liq:luc-desp,st:ps.length?v.length/ps.length:0,inc:ps.filter(isInc),pot:sum(ps.filter(p=>!p.venda),p=>p.preco||0),
    dias:v.length?sum(v,p=>diff(d.data,p.venda.data))/v.length:null}}
function lastDropDate(){const l=liveDrop();return l?l.data:addDays(TODAY,-7)}
function ledger(){
  const rows=[];
  S.pecas.filter(p=>p.venda).forEach(p=>rows.push({data:p.venda.data,tipo:'venda',desc:`Venda ${p.code} · ${p.nome}`,id:p.id,v:reposicao(p)}));
  S.despesas.forEach(d=>rows.push({data:d.data,tipo:'despesa',desc:`${d.cat} · ${d.desc||'sem descrição'}`,did:d.id,v:-(d.valor||0)}));
  S.garimpos.forEach(g=>rows.push({data:g.data,tipo:'garimpo',desc:`Garimpo · ${g.brechoIds.map(i=>B(i)?.nome).join(', ')}`,gid:g.id,v:-(gPago(g)+gGas(g)),gas:gGas(g),pecas:gPago(g)}));
  rows.sort((a,b)=>a.data.localeCompare(b.data)||(a.tipo==='garimpo'?1:-1));
  let s=S.settings.inicial;rows.forEach(r=>{s+=r.v;r.saldo=s});return rows;
}
const caixa=()=>{const l=ledger();return l.length?l[l.length-1].saldo:S.settings.inicial};

function buildSample(){
  const r=mulberry32(11),pick=a=>a[Math.floor(r()*a.length)],btw=(a,b)=>a+r()*(b-a);
  const BR=[
   ['Achados da 410 Sul','Asa Sul','CLS 410, bloco B, loja 12','@achados410','ter a sáb, 10h–19h','medio','Bom de vestido e camisa de seda. Repõe arara às terças.',1.0],

   ['Bazar da Paróquia','Lago Sul','QI 9, salão paroquial','','sábados, 8h–12h','barato','Abre só sábado de manhã. Chegar cedo.',0.9],
   ['Casa Retrô','Sudoeste','CLSW 303, bloco C, loja 8','@casaretro.df','ter a dom, 11h–20h','caro','Curadoria boa, pouca margem. Vale para peça de festa.',0.7],
   ['Banca 12 da Feira','Guará','Feira do Guará, banca 12','','qui a dom, 7h–18h','barato','Muito volume, garimpo demorado. Levar sacola.',1.3],
   ['Taguá Vintage','Taguatinga','CNB 4, lote 6','@taguavintage','seg a sáb, 9h–19h','medio','Forte em anos 80 e 90. Jeans bom.',1.0],
   ['Brechó da Vó Lúcia','Águas Claras','Rua 25 Norte, lote 3','','qua a sáb, 14h–19h','barato','Tricô, lenço, peça de senhora.',1.4],
   ['Bazar do Cruzeiro','Cruzeiro','Quadra 803, área especial','@bazarcruzeiro','sex e sáb, 9h–17h','barato','Pouca coisa, mas muito barato.',1.5],
  ];
  S.brechos=BR.map((b,i)=>{const c=REGIOES[b[1]];return{id:'b'+(i+1),nome:b[0],regiao:b[1],endereco:b[2],insta:b[3],horario:b[4],faixa:b[5],notas:b[6],slow:b[7],lat:c[0]+btw(-.005,.005),lng:c[1]+btw(-.005,.005)}});
  let mon=TODAY;while(s2d(mon).getDay()!==1)mon=addDays(mon,-1);
  const combos=[[0,1],[4,5,6],[0,3],[1,7],[2,0],[4,6],[3,1],[5,0,7],[0,1,4],[1,4,5]];
  let code=1;
  combos.forEach((cb,gi)=>{
    const data=addDays(mon,-7*(combos.length-1-gi));
    const ids=cb.map(i=>S.brechos[i].id);
    const drop=ensureDrop(nextDropDate(data));
    const g={id:'g'+(gi+1),data,brechoIds:ids,km:Math.round(route(ids).km*btw(.95,1.15)),dropId:drop.id};
    S.garimpos.push(g);
    const n=6+Math.floor(r()*4),fresh=drop.data>TODAY;
    const ps=[];
    for(let k=0;k<n;k++){
      const b=S.brechos[cb[k%cb.length]];const cat=pick(Object.keys(CATS));
      const pago=Math.round(b.faixa==='caro'?btw(40,90):b.faixa==='medio'?btw(18,48):btw(8,28));
      ps.push({id:uid('p'),code:'FLP-'+String(code++).padStart(4,'0'),nome:pick(CATS[cat]),foto:null,cat,marca:pick(MARCAS),tam:pick(TAMS),epoca:pick(EPOCAS),estado:pick(ESTADOS),
        medidas:{busto:Math.round(btw(80,100)),cintura:Math.round(btw(62,82)),quadril:Math.round(btw(88,108)),comp:Math.round(btw(50,120))},
        brechoId:b.id,garimpoId:g.id,dropId:drop.id,pago,preco:null,status:'estoque',venda:null,_b:b});
    }
    S.pecas.push(...ps);
    ps.forEach((p,k)=>{
      const b=p._b;delete p._b;
      const f=b.faixa==='caro'?btw(1.8,2.6):btw(2.3,3.8);
      p.preco=Math.max(35,round5(custo(p)*f));
      if(fresh){
        if(k%5<2){p.preco=null;p.estado=null;p.epoca=null;p.marca=null;p.medidas={};if(k%2)p.tam=null;else{p.cat=null;p.nome=pick(['Peça listrada','Peça de tricô','Peça estampada'])}}
        return;
      }
      let dts=CAT_DAYS[p.cat]*b.slow*-Math.log(1-r()*.98);if(r()<.2)dts*=9;
      const sale=addDays(drop.data,Math.round(dts));
      if(sale<=TODAY){p.status='vendida';p.venda={valor:r()<.2?round5(p.preco*.85):p.preco,data:sale,canal:r()<.88?'Instagram':'Presencial'}}
      else p.status=r()<.14?'reservada':'anunciada';
    });
  });
}

const head=(title,sub,actions='',back='')=>`<div class="ph-row"><div>${back}<h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${actions?`<div class="row">${actions}</div>`:''}</div>`;
const kpi=(k,v,s,o={})=>`<div class="kpi ${o.hl?'hl':''}"><div class="k">${o.icon?ic(o.icon):''}${k}</div><div class="v ${o.cls||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;

function strip(ps,n=5){return `<div class="strip">${ps.slice(0,n).map(p=>photo(p)).join('')}${ps.length>n?`<div class="more">+${ps.length-n}</div>`:''}</div>`}

function barChart(items,o={}){
  const W=o.w||680,H=o.h||220,L=54,Bt=28,T=20,n=items.length,bw=(W-L-8)/Math.max(1,n);
  const mx=Math.max(1,...items.map(i=>i.v));const step=mx>2000?1000:mx>800?250:mx>300?100:50;const top=Math.ceil(mx/step)*step;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}" style="width:100%;height:auto;min-width:480px">`;
  for(let i=0;i<=4;i++){const v=top*i/4,y=H-Bt-(H-Bt-T)*i/4;s+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${Math.round(v).toLocaleString('pt-BR')}</text>`}
  items.forEach((it,i)=>{const h=(H-Bt-T)*Math.max(0,it.v)/top,x=L+i*bw+bw*.2,w=bw*.6,y=H-Bt-h;
    s+=`<rect class="b ${it.hl?'hl':''}" x="${x}" y="${y}" width="${w}" height="${Math.max(h,1.5)}" rx="3"/><text x="${x+w/2}" y="${H-9}" text-anchor="middle">${esc(it.label)}</text>${it.v>0?`<text class="lab" x="${x+w/2}" y="${y-6}" text-anchor="middle">${Math.round(it.v).toLocaleString('pt-BR')}</text>`:''}`});
  return s+'</svg>';
}

    <div class="step3"><span class="n">2</span><b>Garimpe com o celular</b><p>Abra este link no celular, tire a foto de cada peça e digite o valor pago.</p><button class="btn sm" data-a="phoneOpen">${ic('phone')}Ver cadastro no celular</button></div>

  const dm=sum(despGerais().filter(x=>x.data.startsWith(mes)),x=>x.valor||0),dpm=sum(despGerais().filter(x=>x.data.startsWith(pm)),x=>x.valor||0);
  const lm=sum(vm,lucro)-dm,lpm=sum(vpm,lucro)-dpm;
  const ld=lastDropDate(),ciclo=S.pecas.filter(p=>p.venda&&p.venda.data>=ld);

      ${strip(s.ps,8)}
      <div><div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:6px"><span><b class="num">${ready}</b> de ${s.ps.length} peças prontas</span><span class="muted">${s.inc.length?`${s.inc.length} para completar`:'tudo pronto para lançar'}</span></div><div class="prog"><b style="width:${s.ps.length?ready/s.ps.length*100:0}%"></b></div></div>
      ${s.inc.length?`<div class="todo">${s.inc.slice(0,4).map(p=>`<div class="ti">${photo(p,'th s')}<div class="grow"><b style="font-weight:500">${esc(p.nome)}</b> <span class="mono">${p.code}</span><div class="warnline" style="font-size:12px">Falta ${missing(p).join(', ')}</div></div><button class="btn sm" data-a="openPeca" data-id="${p.id}" data-list="inc:${prep.id}">Completar</button></div>`).join('')}</div>`:''}

    </div>`}
  let liveCard='';
  if(live){const s=dStats(live);const nr=s.ps.filter(p=>p.status==='reservada').length;liveCard=`<div class="card card-p stack">
      <div class="sec-h" style="margin:0"><div class="row" style="gap:10px"><h2>Drop ${live.n}</h2>${dPill(live)}</div><span class="muted">lançado ${fDow(live.data)}</span></div>
      <div class="meta"><span><b>${s.v.length}</b> de ${s.ps.length} vendidas</span><span><b>${nr}</b> reservada${nr===1?'':'s'}</span><span>Receita <b>${brl0(s.rec)}</b></span><span>Lucro <b>${brl0(s.liq)}</b></span></div>

function vDrop(n){

  const cols=[['completar','A completar','sem preço, tamanho ou categoria'],['estoque','Prontas','cadastradas, não anunciadas'],['anunciada','Anunciadas','postadas no Instagram'],['reservada','Reservadas','cliente pediu para separar'],['vendida','Vendidas','']];

    <p class="muted" style="font-size:12px;margin:10px 0 0">Arraste os cards entre as colunas para mudar o status. Soltar em Vendidas abre o registro da venda.</p>`;
  }else if(ui.dt==='lista'){
    body=pecasTable(ps,{list:'drop:'+d.id,noDrop:1});
  }else{
    body=`<div class="stack">${s.gs.map(g=>{const gp=pecasDe(g);return `<div class="card card-p stack"><div class="sec-h" style="margin:0"><h2>Garimpo de ${fDow(g.data)}</h2><span class="muted">${gp.length} peças</span></div>
      <div class="g4">${kpi('Brechós',String(g.brechoIds.length),g.brechoIds.map(i=>B(i)?.nome).join(', '))}${kpi('Km rodados',g.km+' km',`${S.settings.kmL} km/l`)}${kpi('Gasolina',brl(gGas(g)),`${brl(S.settings.gas)} o litro`)}${kpi('Peças',brl(gPago(g)),`média ${brl(gPago(g)/Math.max(1,gp.length))}`)}</div>
      <div class="tw"><table class="t"><thead><tr><th>Peça</th><th>Brechó</th><th class="r">Pago</th><th class="r">+ Gasolina</th><th class="r">Custo real</th><th class="r">Preço</th><th class="r">Margem</th></tr></thead><tbody>${gp.map(p=>`<tr class="click" data-a="openPeca" data-id="${p.id}" data-list="drop:${d.id}"><td>${pc(p)}</td><td class="muted">${esc(B(p.brechoId)?.nome)}</td><td class="r">${brl(p.pago)}</td><td class="r muted">${brl(gasShare(p))}</td><td class="r">${brl(custo(p))}</td><td class="r">${p.preco?brl(p.venda?.valor||p.preco):'—'}</td><td class="r">${p.preco?pct(lucro(p)/(p.venda?.valor||p.preco)):'—'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td></td><td class="r">${brl(gPago(g))}</td><td class="r">${brl(gGas(g))}</td><td class="r">${brl(gPago(g)+gGas(g))}</td><td></td><td></td></tr></tfoot></table></div></div>`}).join('')||'<div class="empty">Nenhum garimpo ligado a este drop.</div>'}
      <p class="muted" style="font-size:12px;margin:0">A gasolina de cada garimpo é dividida entre as peças proporcionalmente ao valor pago. Uma peça de R$ 40 carrega o dobro de gasolina de uma de R$ 20.</p></div>`;
  }

function filtPecas(){
  let a=S.pecas.slice();const f=ui.pf;
  if(f==='paradas')a=a.filter(isStale);else if(f!=='todas')a=a.filter(p=>col(p)===f);
  if(ui.pdrop)a=a.filter(p=>p.dropId===ui.pdrop);
  if(ui.pbre)a=a.filter(p=>p.brechoId===ui.pbre);
  if(ui.pcat)a=a.filter(p=>p.cat===ui.pcat);
  if(ui.pmar)a=a.filter(p=>(p.marca||'')===ui.pmar);
  if(ui.pq){const q=ui.pq.toLowerCase();a=a.filter(p=>(p.nome+' '+p.code+' '+(B(p.brechoId)?.nome||'')+' '+(p.cat||'')+' '+(p.marca||'')).toLowerCase().includes(q))}
  const so={recentes:(x,y)=>entry(y).localeCompare(entry(x))||y.code.localeCompare(x.code),lucro:(x,y)=>(lucro(y)??-1e9)-(lucro(x)??-1e9),preco:(x,y)=>(y.preco||0)-(x.preco||0),dias:(x,y)=>(dias(y)??-1)-(dias(x)??-1)};
  return a.sort(so[ui.ps]);
}

  const list=S.brechos.filter(b=>(!ui.breg||b.regiao===ui.breg)&&(!q||(b.nome+' '+(b.endereco||'')+' '+b.regiao+' '+(b.insta||'')).toLowerCase().includes(q))).sort((a,b)=>a.regiao.localeCompare(b.regiao,'pt-BR')||a.nome.localeCompare(b.nome,'pt-BR'));

  }else{
    const r=route(ui.rota),ord=r.order;
    const byReg={};S.brechos.forEach(b=>(byReg[b.regiao]=byReg[b.regiao]||[]).push(b));
    body=`<div class="split2"><div class="card" style="max-height:640px;overflow:auto">${Object.keys(byReg).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(reg=>`<div class="checkrow" style="cursor:default;background:var(--panel)"><span class="grow"><b style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">${esc(reg)}</b></span></div>${byReg[reg].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(b=>{const on=ui.rota.includes(b.id);const i=ord.findIndex(x=>x.id===b.id);return `<div class="checkrow ${on?'on':''}" data-a="rotaToggle" data-id="${b.id}"><span class="box"></span><span class="grow"><b>${esc(b.nome)}</b><small>${esc(b.endereco)||'endereço não cadastrado'}${b.horario?' · '+esc(b.horario):''}</small></span>${i>=0?`<span class="mono">${i+1}ª parada</span>`:''}</div>`}).join('')}`).join('')||'<div class="empty">Cadastre brechós para planejar uma rota.</div>'}</div>
    <div class="stack">
      ${ord.length?`<div class="card card-p stack" style="gap:8px"><b>Ordem sugerida</b>${ord.map((b,i)=>`<div class="row nowrap" style="font-size:13px"><span class="mono" style="width:22px">${i+1}.</span><span style="min-width:0">${esc(b.nome)} <span class="muted">· ${esc(b.regiao)}</span></span></div>`).join('')}</div>`:''}
      <div class="money2"><div><div class="k">Distância estimada</div><div class="v">${r.km} km</div></div><div><div class="k">Gasolina</div><div class="v">${brl(gasCost(r.km))}</div></div></div>
      <p class="muted" style="margin:0;font-size:12px">Estimativa pela distância entre as regiões, saindo de ${esc(S.settings.home)} e voltando. Para o trajeto exato, abra no Google Maps.</p>

      <button class="btn pri full" data-a="rotaPhone" ${ui.rota.length?'':'disabled'}>${ic('phone')}Começar garimpo com essa rota</button>

  `<div class="tabs">${[['lista','Lista'],['rota','Planejar rota']].map(([k,l])=>`<button class="${ui.bv===k?'on':''}" data-a="bv" data-v="${k}">${l}</button>`).join('')}</div>${body}`;
}

function vRel(){
  const sold=S.pecas.filter(p=>p.venda),done=S.pecas.filter(p=>entry(p)<=TODAY);
  const past=S.drops.filter(d=>d.data<=TODAY).slice().reverse();
  const bs=S.brechos.map(b=>({b,...bStats(b)})).sort((a,b)=>(b.roi??-1)-(a.roi??-1));const mr=Math.max(...bs.map(x=>x.roi||0));
  const grp=key=>{const m={};S.pecas.filter(p=>p.venda&&p[key]).forEach(p=>{(m[p[key]]=m[p[key]]||[]).push(p)});return Object.entries(m).map(([k,v])=>({k,n:v.length,dias:sum(v,p=>diff(entry(p),p.venda.data))/v.length,mg:sum(v,lucro)/sum(v,p=>p.venda.valor),luc:sum(v,lucro)})).sort((a,b)=>a.dias-b.dias)};
  const cats=grp('cat'),eps=grp('epoca'),mars=grp('marca').sort((a,b)=>b.luc-a.luc);const md=Math.max(1,...cats.map(c=>c.dias),...eps.map(c=>c.dias),...mars.map(c=>c.dias));
  const gtbl=(rows,lab)=>`<div class="tw"><table class="t" style="min-width:520px"><thead><tr><th>${lab}</th><th class="r">Vendidas</th><th class="r">Lucro</th><th class="r">Margem</th><th class="r">Dias p/ vender</th><th style="width:26%"></th></tr></thead><tbody>${rows.map(c=>`<tr><td><b style="font-weight:500">${esc(c.k)}</b></td><td class="r">${c.n}</td><td class="r">${brl0(c.luc)}</td><td class="r">${pct(c.mg)}</td><td class="r">${c.dias.toFixed(1)}</td><td><div class="bar"><b style="width:${c.dias/md*100}%"></b></div></td></tr>`).join('')}</tbody></table></div>`;
  return head('Relatórios','O que dá dinheiro, o que vende rápido e o que fica parado.')+`
  <div class="kpis">${kpi('Taxa de venda',pct(sold.length/Math.max(1,done.length)),`${sold.length} de ${done.length} peças lançadas`)}${kpi('Dias até vender',(sum(sold,p=>diff(entry(p),p.venda.data))/Math.max(1,sold.length)).toFixed(1),'média, contando do drop')}${kpi('Margem média',pct(sum(sold,lucro)/Math.max(1,sum(sold,p=>p.venda.valor))),'lucro ÷ valor de venda')}${kpi('Gasolina por peça',brl(sum(S.garimpos,gGas)/Math.max(1,S.pecas.length)),`${brl0(sum(S.garimpos,gGas))} em ${S.garimpos.length} garimpos`)}</div>
  <div class="sec-h"><h2>Desempenho por drop</h2></div>
  <div class="tw" style="margin-bottom:28px"><table class="t"><thead><tr><th>Drop</th><th class="r">Peças</th><th class="r">Vendidas</th><th style="width:16%"></th><th class="r">Dias p/ vender</th><th class="r">Investido</th><th class="r">Receita</th><th class="r">Lucro</th></tr></thead><tbody>${past.map(d=>{const s=dStats(d);return `<tr class="click" data-a="goDrop" data-v="${d.n}"><td><b style="font-weight:500">Drop ${d.n}</b> <span class="muted">· ${fDay(d.data)}</span></td><td class="r">${s.ps.length}</td><td class="r">${pct(s.st)}</td><td><div class="bar"><b style="width:${s.st*100}%"></b></div></td><td class="r">${s.dias==null?'—':s.dias.toFixed(1)}</td><td class="r">${brl0(s.inv)}</td><td class="r">${brl0(s.rec)}</td><td class="r ${s.liq>=0?'pos':'neg'}">${brl0(s.liq)}</td></tr>`}).join('')}</tbody></table></div>
  <div class="sec-h"><h2>Ranking de brechós</h2><span class="muted">ROI = lucro ÷ custo real (peça + gasolina), nas peças vendidas</span></div>
  <div class="tw" style="margin-bottom:28px"><table class="t"><thead><tr><th>Brechó</th><th class="r">Compradas</th><th class="r">Vendidas</th><th class="r">Lucro</th><th class="r">ROI</th><th style="width:20%"></th><th class="r">Dias p/ vender</th></tr></thead><tbody>${bs.map(x=>`<tr class="click" data-a="openBrecho" data-id="${x.b.id}"><td><b style="font-weight:500">${esc(x.b.nome)}</b></td><td class="r">${x.ps.length}</td><td class="r">${x.v.length}</td><td class="r">${brl0(x.luc)}</td><td class="r"><b>${pct(x.roi)}</b></td><td><div class="bar"><b style="width:${mr?(x.roi||0)/mr*100:0}%"></b></div></td><td class="r">${x.dias==null?'—':x.dias.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>
  <div class="g2" style="align-items:start"><div style="min-width:0"><div class="sec-h"><h2>Categorias</h2><span class="muted">mais rápidas primeiro</span></div>${gtbl(cats,'Categoria')}</div><div style="min-width:0"><div class="sec-h"><h2>Épocas</h2><span class="muted">mais rápidas primeiro</span></div>${gtbl(eps,'Época')}</div></div>
  <div class="sec-h" style="margin-top:28px"><h2>Marcas</h2><span class="muted">maior lucro primeiro</span></div>${gtbl(mars,'Marca')}`;
}

function vAjustes(){
  const s=S.settings;
  const past=S.drops.filter(d=>d.data<=TODAY).slice(-4);
  const l4=sum(past,d=>dStats(d).luc)/Math.max(1,past.length);
  const cm=sum(S.pecas,p=>p.pago||0)/Math.max(1,S.pecas.length);
  const extra=l4*s.reinvest/100;
  const f=(k,l,v,pre,step='0.01',hint='')=>`<div class="fld"><label for="s-${k}">${l}</label><div class="affix">${pre?`<span>${pre}</span>`:''}<input class="input num" id="s-${k}" data-s="${k}" type="number" inputmode="decimal" step="${step}" value="${v}" ${pre?'':'style="padding-left:11px"'}></div>${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  return head('Ajustes','Valores usados em todos os cálculos. Mudou o preço da gasolina? Atualize aqui e tudo é recalculado.')+`
  <div class="stack" style="max-width:760px;gap:18px">
  <div class="card card-p stack"><h2>Reposição do estoque</h2>
    <div class="callout">${ic('info')}<p><b>Sugestão: 30% do lucro.</b> Com drop toda semana, o custo de cada peça vendida já repõe o estoque no mesmo tamanho. Os 30% do lucro fazem cada drop crescer um pouco sem pesar na sua renda. Quando o drop chegar no tamanho que você consegue fotografar e postar em uma semana, baixe para 15–20%.</p></div>
    <div class="fld"><label for="s-reinvest">Parte do lucro que volta para o caixa: <b class="num" style="color:var(--fg)">${s.reinvest}%</b></label><input id="s-reinvest" data-s="reinvest" type="range" min="0" max="60" step="5" value="${s.reinvest}" style="accent-color:var(--accent)"></div>
    <p class="muted" style="margin:0">Com o lucro médio dos últimos drops (${brl0(l4)} por drop), ${s.reinvest}% são <b style="color:var(--fg)">${brl0(extra)}</b> a mais por garimpo, cerca de ${Math.round(extra/Math.max(1,cm))} peças a mais por drop no seu preço médio de compra (${brl0(cm)}).</p>
    <div class="g2">${f('inicial','Capital inicial do caixa',s.inicial,'R$','1')}<div class="fld"><label for="s-dropDay">Dia do drop</label><select class="input" id="s-dropDay" data-s="dropDay">${DOW.map((d,i)=>`<option value="${i}" ${+s.dropDay===i?'selected':''}>${d}</option>`).join('')}</select><span class="hint">Vale para os próximos drops.</span></div></div>
  </div>
  <div class="card card-p stack"><h2>Gasolina</h2>
    <div class="g3">${f('gas','Preço do litro',s.gas,'R$')}${f('kmL','Consumo do carro (km/l)',s.kmL,'','0.1')}<div class="fld"><label for="s-home">Saída das rotas</label><select class="input" id="s-home" data-s="home">${Object.keys(REGIOES).map(r=>`<option ${s.home===r?'selected':''}>${r}</option>`).join('')}</select></div></div>
    <p class="muted" style="margin:0;font-size:13px">Cada km rodado custa ${brl(s.gas/s.kmL)}.</p>
  </div>
  <div class="card card-p stack"><h2>Preço e estoque</h2>
    <div class="g2">${f('markup','Markup para sugerir preço (× custo real)',s.markup,'','0.1','Preço sugerido = custo real × markup, arredondado de 5 em 5.')}${f('stale','Avisar peça parada após (dias)',s.stale,'','1')}</div>
  </div>
  <div class="card card-p stack"><h2>Conta e dados</h2>
    <p class="muted" style="margin:0">Conectada como <b style="color:var(--fg)">${esc(SYNC.user?.email||'—')}</b>. Tudo fica salvo no banco do Flopes e sincroniza entre celular e computador. Sem internet, as alterações ficam guardadas no aparelho e são enviadas quando a conexão voltar.</p>
    ${Object.keys(SYNC.pend).length?`<div class="warnline">${ic('alert')}${Object.keys(SYNC.pend).length} alteração(ões) ainda não enviada(s).</div>`:''}
    <div class="row"><button class="btn" data-a="backup">Baixar backup (.json)</button><button class="btn ghost" data-a="logout">Sair desta conta</button></div>
  </div>
  </div>`;
}

function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();
  img.onload=()=>{const draw=m=>{const s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c};
    const small=draw(560).toDataURL('image/jpeg',.74);const big=draw(1400);big.toBlob(b=>res({url:small,blob:b}),'image/jpeg',.86)};
  img.onerror=()=>res({url:null,blob:null});img.src=fr.result};fr.readAsDataURL(file)})}

  try{
    const ups=keys.filter(k=>SYNC.pend[k].op==='up'),dels=keys.filter(k=>SYNC.pend[k].op==='del');
    for(let i=0;i<ups.length;i+=200){const chunk=ups.slice(i,i+200),snap=chunk.map(k=>SYNC.pend[k]);
      const {error}=await sb.from('registros').upsert(snap.map(p=>({col:p.col,id:p.id,data:p.data,updated_at:new Date().toISOString()})),{onConflict:'col,id'});
      if(error)throw error;chunk.forEach((k,j)=>{if(SYNC.pend[k]===snap[j])delete SYNC.pend[k]})}
    for(const k of dels){const p=SYNC.pend[k];const {error}=await sb.from('registros').delete().eq('col',p.col).eq('id',p.id);if(error)throw error;if(SYNC.pend[k]===p)delete SYNC.pend[k]}
  }catch(e){fail=e}
  SYNC.busy=false;lsSet(LS_PEND,SYNC.pend);
  if(fail){setSave(navigator.onLine?'err':'offline');
    if(navigator.onLine&&!SYNC.errShown){SYNC.errShown=true;toast((fail.code==='42501'||/row-level security|JWT/i.test(fail.message||''))?'Sua sessão expirou ou não tem permissão. Saia e entre de novo em Ajustes.':'Não consegui salvar agora. Vou tentar de novo sozinho.')}
    clearTimeout(SYNC.retry);SYNC.retry=setTimeout(flush,15000)}
  else{SYNC.errShown=false;setSave(Object.keys(SYNC.pend).length?'saving':'ok')}
  if(SYNC.again){SYNC.again=false;flush()}
}
async function uploadPending(){
  if(!sb||!navigator.onLine||SYNC.upBusy||SYNC.mode!=='live')return;SYNC.upBusy=true;let n=0;
  for(const p of S.pecas.slice()){if(!(p.foto&&String(p.foto).startsWith('data:')&&!p.fotoUrl))continue;
    try{const blob=await (await fetch(p.foto)).blob();const url=await putPhoto(blob);const q=P(p.id);if(q){q.fotoUrl=url;q.foto=null;n++}}catch(e){break}}
  SYNC.upBusy=false;if(n){flushSoon();remoteChanged()}
}
function remoteChanged(){
  saveCache();if(SYNC.mode!=='live')return;
  const a=document.activeElement;
  if(a&&a.matches('input,select,textarea')&&a.id!=='gq'){SYNC.deferred=true;return}
  cancelAnimationFrame(SYNC.rt);SYNC.rt=requestAnimationFrame(()=>render());
}
async function fetchAll(){const rows=[];for(let from=0;;from+=1000){const {data,error}=await sb.from('registros').select('col,id,data').order('col').order('id').range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}return rows}
function applyServer(rows){
  COLS.forEach(c=>S[c]=[]);SYNC.saved={};SYNC.hasSettings=false;
  rows.forEach(r=>{const k=r.col+'/'+r.id;
    if(r.col==='config'&&r.id==='settings'){Object.assign(S.settings,r.data||{});SYNC.hasSettings=true;SYNC.saved[k]=canon(S.settings)}
    else if(COLS.includes(r.col)){const o={...(r.data||{}),id:r.id};S[r.col].push(o);SYNC.saved[k]=canon(o)}});
  for(const k of Object.keys(SYNC.pend)){const p=SYNC.pend[k];
    if(p.col==='config'){Object.assign(S.settings,p.data);continue}
    if(!COLS.includes(p.col))continue;S[p.col]=S[p.col].filter(o=>o.id!==p.id);if(p.op==='up')S[p.col].push(JSON.parse(JSON.stringify(p.data)))}
  S.drops.sort((a,b)=>a.data.localeCompare(b.data));
}
async function resync(){if(!sb||SYNC.mode!=='live'||!navigator.onLine)return;try{applyServer(await fetchAll());SYNC.hasSettings=true;saveCache();remoteChanged();flush();uploadPending()}catch(e){}}
function subscribeRT(){
  if(!sb||SYNC.chan)return;
  SYNC.chan=sb.channel('flopes-registros').on('postgres_changes',{event:'*',schema:'public',table:'registros'},pl=>{
    const row=pl.eventType==='DELETE'?pl.old:pl.new;if(!row||!row.col||!row.id)return;const k=row.col+'/'+row.id;if(SYNC.pend[k])return;
    if(pl.eventType==='DELETE'){if(!COLS.includes(row.col))return;if(k in SYNC.saved||S[row.col].some(o=>o.id===row.id)){S[row.col]=S[row.col].filter(o=>o.id!==row.id);delete SYNC.saved[k];remoteChanged()}return}
    if(row.col==='config'&&row.id==='settings'){const cs=canon(row.data);if(SYNC.saved[k]===cs)return;Object.assign(S.settings,row.data);SYNC.saved[k]=canon(S.settings);SYNC.hasSettings=true;remoteChanged();return}
    if(!COLS.includes(row.col))return;const o={...(row.data||{}),id:row.id};const cs=canon(o);if(SYNC.saved[k]===cs)return;SYNC.saved[k]=cs;
    const i=S[row.col].findIndex(x=>x.id===row.id);if(i>=0)S[row.col][i]=o;else S[row.col].push(o);if(row.col==='drops')S.drops.sort((a,b)=>a.data.localeCompare(b.data));remoteChanged();
  }).subscribe();
}
function vLogin(){return `<div class="ob"><div class="ob-card"><div class="row" style="justify-content:space-between"><span class="wordmark">Flopes</span>${themeBtn()}</div>
  <h1>Entrar no Flopes</h1><p class="muted">Use o e-mail e a senha cadastrados para você. Só precisa entrar uma vez em cada aparelho.</p>
  <form id="loginForm" class="stack" style="gap:12px"><div class="fld"><label for="lg-email">E-mail</label><input class="input" id="lg-email" type="email" autocomplete="username" inputmode="email" required></div>
  <div class="fld"><label for="lg-pass">Senha</label><input class="input" id="lg-pass" type="password" autocomplete="current-password" required></div>
  <button class="btn pri lg full" type="submit" id="lg-btn">Entrar</button><p class="neg" id="lg-err" style="margin:0;font-size:13px" role="alert"></p></form></div></div>`}
function vMsg(t,p,btn=''){return `<div class="ob"><div class="ob-card"><span class="wordmark">Flopes</span><h1>${t}</h1><p class="muted">${p}</p>${btn}</div></div>`}
document.addEventListener('submit',async e=>{if(e.target.id!=='loginForm')return;e.preventDefault();
  const btn=$('lg-btn'),err=$('lg-err');btn.disabled=true;btn.textContent='Entrando…';err.textContent='';
  try{const {error}=await sb.auth.signInWithPassword({email:$('lg-email').value.trim(),password:$('lg-pass').value});
    if(error){err.textContent=navigator.onLine?'E-mail ou senha incorretos.':'Sem internet. Conecte-se para entrar pela primeira vez.';btn.disabled=false;btn.textContent='Entrar';return}
    SYNC.mode='loading';render();boot();
  }catch(x){err.textContent='Não consegui conectar. Tente de novo.';btn.disabled=false;btn.textContent='Entrar'}});
A.backup=()=>{const data={app:'Flopes',exportadoEm:new Date().toISOString(),settings:S.settings,brechos:S.brechos,garimpos:S.garimpos,drops:S.drops,pecas:S.pecas,despesas:S.despesas};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`flopes-backup-${TODAY}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup baixado')};
A.logout=async()=>{if(Object.keys(SYNC.pend).length){toast('Ainda há alterações não enviadas. Conecte-se à internet antes de sair.');return}
  try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem(LS_CACHE);localStorage.removeItem(LS_PEND)}catch(e){}location.reload()};
async function boot(){
  if(!sb){SYNC.mode='msg';SYNC.msg=['Não consegui carregar o Flopes','Verifique a internet e abra de novo.'];render();return}
  SYNC.pend=lsGet(LS_PEND)||{};
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(!session){SYNC.mode='login';render();return}
  SYNC.user=session.user;
  const cache=lsGet(LS_CACHE);
  if(cache){COLS.forEach(c=>S[c]=cache[c]||[]);Object.assign(S.settings,cache.settings||{});SYNC.saved=cache.saved||{};SYNC.hasSettings=!!cache.hasSettings;SYNC.mode='live';render()}
  try{
    const rows=await fetchAll();applyServer(rows);
    if(!SYNC.hasSettings)S.settings.confirmed=false;SYNC.hasSettings=true;SYNC.mode='live';saveCache();render();flushSoon();uploadPending();
  }catch(e){
    if(!cache){SYNC.mode='msg';SYNC.msg=['Sem conexão','Conecte-se à internet uma vez para carregar seus dados neste aparelho. Depois o Flopes funciona mesmo sem sinal.',`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`];render();return}
    setSave('offline');
  }
  subscribeRT();
}
addEventListener('online',()=>{setSave(Object.keys(SYNC.pend).length?'saving':'ok');flush();resync()});
addEventListener('offline',()=>setSave('offline'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')resync()});
if(sb)sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT'&&SYNC.mode==='live'){SYNC.mode='login';render()}if(ses)SYNC.user=ses.user});
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

lastPhone=isPhone();
render();
boot();
(function splash(){
  const sp=$('splash');if(!sp)return;
  const fin=()=>{if(sp.isConnected)sp.remove()};
  const tgt={spN:[0,1]};
  const t0=performance.now()+1050,dur=900;
  (function tick(t){const k=Math.min(1,Math.max(0,(t-t0)/dur)),e=1-Math.pow(1-k,3);
    tgt.spN[0]=S.pecas.length;for(const id in tgt){const el=$(id);if(el)el.textContent=String(Math.round(tgt[id][0]*e)).padStart(tgt[id][1],'0')}
    if(k>=1&&SYNC.mode!=='loading'&&!S.pecas.length){const sb=sp.querySelector('.sp-sub');if(sb)sb.innerHTML='pronta para o primeiro garimpo <span class="hrt">♡</span>';return}
    if((k<1||SYNC.mode==='loading')&&sp.isConnected)requestAnimationFrame(tick)})(performance.now());
  const sk=sp.querySelector('.sp-skip');if(sk&&matchMedia('(pointer:fine)').matches)sk.textContent='clique para entrar';
  sp.addEventListener('click',()=>{sp.classList.add('skip');setTimeout(fin,500)});
  sp.addEventListener('animationend',e=>{if(e.target===sp&&e.animationName==='spOut')fin()});
  setTimeout(fin,3300);
})();
</script>
